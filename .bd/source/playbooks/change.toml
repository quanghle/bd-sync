playbook = "change"
title = "Change ({{tier}}): {{task}}"
description = """
One step list for every change; the tier sets how deep each step goes and adds steps for \
riskier work. small: bug fix, refactor, isolated command change. standard: new command or flag, \
schema migration, public behavior, wire protocol, feature. critical: authentication, sign-in and \
tokens, server security, data migrations that can lose data, release, CI and supply chain. Each step closes with the evidence its acceptance criteria \
name (`bd comment add` on the step, then `bd close <step> --reason "..."`). Decision records \
live in bd: the step's design field (`bd update <step> --design "..."`) or `decision` issues \
under the step, never repo files or chat. If a step finds the work belongs to a higher tier, \
stop and start a new run at that tier. Human gates are resolved by a person (`bd gate resolve`), \
never by an agent."""
labels = ["change:{{tier}}"]

[vars.task]
description = "What changes, in a few words (used in titles)"
required = true

[vars.tier]
description = "small | standard | critical"
required = true
enum = ["small", "standard", "critical"]

[vars.approval]
description = "standard: put a human design approval in front of implementation (always on for critical)"
default = "no"
enum = ["no", "yes"]

[vars.approver]
description = "Who resolves the requirements, design and sign-off gates"
default = "Quang Le"

[vars.score_confirm]
description = "Who confirms the judge's score: judge (its draft is the score, no gate) or person (a human gate)"
default = "judge"
enum = ["judge", "person"]

# 1. Requirements -------------------------------------------------------------

[[steps]]
id = "requirements"
title = "Requirements: {{task}}"
type = "story"
description = """
small: short requirements, the problem (for a bug, how to reproduce it), the expected behavior, \
what is out of scope.
standard: detailed acceptance criteria, user-visible behavior, public interface (commands, \
flags, output and JSON shapes, exit codes, wire protocol, MCP tools), schema and migrations, local \
and remote workspaces, Linux, macOS and Windows, out of scope.
critical: the standard criteria plus actors and data involved, compliance or policy \
constraints, rollout and rollback expectations.
Every tier: start this run before investigating the task, and make the estimate its first \
update: how hard the work is from the task alone, against .bd/rubric.md (Complexity: size, \
ambiguity, novelty, risk, breadth; count the tests and verification it will need, not just the code), on the run (the parent of this step), so it measures how well \
work is sized up front. bd can only order it against bd events, so investigation before the run \
started can't be checked: don't do it. \
`bd update <run> --set-metadata 'complexity_estimate={"rubric":3,"score":3,"factors":"...","by":"<your bd actor>"}'`. \
Keep it in that metadata only, out of comments and close reasons: the judge must score complexity \
without seeing it."""
acceptance_criteria = """
Evidence: the requirements in this step's acceptance field (`bd update <step> --acceptance "..."`), \
each one testable; open questions answered or recorded with `bd create`; the run's \
complexity_estimate metadata, with the factors behind it (not repeated in the close reason), \
set as the run's first update after it started (bd history), before any commit for the task. small: 2-5 bullets."""

[[steps]]
id = "requirements-approval"
title = "Requirements approval: {{task}}"
type = "decision"
condition = "{{tier}} == critical"
needs = ["requirements"]
description = "Record the approval of the requirements, with any changes the approver asked for."
acceptance_criteria = "Evidence: the approver and any conditions in the close reason."

[steps.gate]
type = "human"
title = "Approve requirements: {{task}}"
assignee = "{{approver}}"
description = "Review the requirements step of this run, then `bd gate resolve` this gate."

# 2. Decisions ----------------------------------------------------------------

[[steps]]
id = "decisions"
title = "Decisions: {{task}}"
type = "decision"
needs = ["requirements", "requirements-approval"]
description = """
small: local decisions in this step's design field, approach chosen, alternatives dropped, \
conventions followed or departed from (AGENTS.md).
standard: architecture and implementation decisions in the design field, structure, command \
and API shape and naming, transactions, events and readiness (graph::recompute seeds), indexes and \
query plans, test plan; each significant decision (breaking change, schema change, new dependency, \
raised MSRV, new convention) as its own \
issue: `bd create "Decision: ..." -t decision --parent <step> --design "..."`. A significant \
decision needs approval: ask, and add a gate (`bd gate create --type human --blocks <implement step>`) \
if the run has none.
critical: formal ADRs, one per significant decision: \
`bd create "ADR: ..." -t decision --parent <step> -l adr:proposed --design "..."` with Context, \
Decision, Alternatives considered and Consequences; close each once written (it is a record); its \
status is its label (adr:proposed, adr:accepted, adr:rejected, adr:superseded). The design field \
summarizes the architecture and lists the ADR ids."""
acceptance_criteria = """
Evidence: the design field lists each decision with its reason ('none beyond the obvious fix' is \
fine for a one-line small change); standard and critical: the API surface and test plan mapped to \
the requirements, significant decisions or ADRs as child decision issues."""

# 3. Security -----------------------------------------------------------------

[[steps]]
id = "security"
title = "Security: {{task}}"
type = "task"
labels = ["security"]
needs = ["decisions"]
description = """
small: quick impact assessment, does it touch tokens or policy checks, untrusted input from \
clients, providers or servers, text reaching a terminal or an agent's context, files, new \
dependencies?
standard: threat assessment of the design, authorization (roles, actor binding, admin/local \
checks, claim overrides), untrusted input and its escaping, size and time limits, secrets in logs \
or output, file permissions, the agent-asset approval gate, third-party code, unbounded work.
critical: threat model (STRIDE or equivalent), assets, trust boundaries, entry points, data \
flows; each threat with likelihood, impact and mitigation."""
acceptance_criteria = """
Evidence: in this step's design field, each threat considered with its mitigation (or why it \
does not apply), referencing the decisions it covers; small: the verdict and one line of \
reasoning. Mitigations that need code go into the test plan."""

[[steps]]
id = "risk-review"
title = "Risk review: {{task}}"
type = "task"
labels = ["security"]
condition = "{{tier}} == critical"
needs = ["security"]
description = "Review residual risk after mitigations, dependency and supply-chain impact, secrets handling, monitoring, and the rollback plan."
acceptance_criteria = "Evidence: in this step's design field, the residual risks accepted or rejected and the rollback plan."

[[steps]]
id = "design-approval"
title = "Design approval: {{task}}"
type = "decision"
condition = "{{tier}} == critical || {{approval}} == yes"
needs = ["security", "risk-review"]
description = """
Record the approval of the decisions and security work. critical: explicit architecture and \
security approval; relabel each ADR (`bd label rm <adr> adr:proposed`, then \
`bd label add <adr> adr:accepted` or adr:rejected)."""
acceptance_criteria = "Evidence: the approver and any conditions in the close reason; critical: no ADR left adr:proposed."

[steps.gate]
type = "human"
title = "Approve design: {{task}}"
assignee = "{{approver}}"
description = "Review the decisions, security and (critical) risk-review steps of this run, then `bd gate resolve` this gate."

# 4. Implement, verify, review ------------------------------------------------

[[steps]]
id = "implement"
title = "Implement: {{task}}"
type = "task"
needs = ["security", "risk-review", "design-approval"]
description = """
Implement against the requirements and decisions, following AGENTS.md Conventions & Patterns, \
with tests for each requirement and mitigation (unit tests in the crate, end-to-end ones in \
crates/bd/tests/; critical: negative and abuse cases too) and the docs/ or CONTRIBUTING.md page \
the change affects. A deviation from a recorded decision goes back to the decisions step (and \
its approval). The `plan-implement-review` workflow covers this step, verify and review; pass it \
this run's review step as reviewStep (its planner reads this run's requirements and decisions as \
settled input, and its review-fix loop is recorded on that step) and tier={{tier}}. It comments \
the findings whose fix a re-review confirmed and returns them as confirmedFixes, and returns filed \
findings its triage dropped in dropped (with bdId): close those after closing this step and verify \
(bd won't close a child of a blocked step). The workflow is the Copilot CLI extension or the \
Claude Code workflow (`.claude/workflows/plan-implement-review.js`), whichever harness runs the \
session. Shadow review is required: every run adds reviewer-catch data. The Copilot extension runs \
its default shadows; in Claude Code always pass shadowReview, by default { model: "sonnet", \
effort: "medium" } (a level below the gating reviewers; pick another model and effort when \
`node .github/scripts/reviewer-catch.mjs` flags its cell as thin). Shadow findings are data only: \
never fix, file or triage them. Work done outside the workflow still reviews through it \
(skipImplement with plan, workdir and baseline, plus shadowReview; see review). Keep the \
workflow's result for the score step. The controller (whoever starts the workflow) sets the \
coding agents' model and effort with model and effort (AGENTS.md "Delegating to agents", including \
the coder exploration quota: record `exploration` metadata on the run before implementing when it \
applies)."""
acceptance_criteria = "Evidence: close reason names the commit(s); a comment maps each requirement (and mitigation) to its code and test, and names the shadow reviewer model(s) and effort(s) with the shadowFindings count per round."

[[steps]]
id = "verify"
title = "Verify: {{task}}"
type = "task"
needs = ["implement"]
description = """
Run the CI gates: `cargo fmt --all --check`, `cargo clippy --workspace --all-targets -- -D warnings` \
and `cargo test --workspace`. Run `target/release/bd bench --workers 8` (and `--mode remote` when \
claims go through the server) when recompute, claims, indexes or the write path change, and check \
`crates/bd-core/tests/plans.rs` covers new queries. Keep Linux, macOS and Windows building: check \
cfg-gated code on the other platforms (CI, or the Windows host and the Mac) when it changes; \
always for critical."""
acceptance_criteria = "Evidence: a comment with the gate results, and the bench and other-platform results where they apply."

[[steps]]
id = "review"
title = "Review: {{task}}"
type = "task"
needs = ["verify"]
description = """
small: review the diff (`/code-review`).
standard: independent review by someone other than the implementer, a fresh reviewer agent or a person.
critical: independent code and security review (`/code-review` at high effort plus `/security-review`, or a person).
Every tier: the gating review (the pass the tier line above names) runs on the strongest model class \
(AGENTS.md "Delegating to agents") and needs a shadow review, and that pass and its shadow run in \
plan-implement-review so they are journaled for `node .github/scripts/reviewer-catch.mjs`. When the \
work was done outside the workflow, run the review through it anyway: skipImplement with plan, \
workdir and baseline (the commit the work started from), plus shadowReview and this step as \
reviewStep. Don't run the gating review or its shadow as plain subagents. Shadow findings are data \
only, never filed or fixed; record the shadow model, effort and finding count in the round's comment.
Review-fix loop, recorded on this step (the `plan-implement-review` workflow with reviewStep does it):
1. File each blocker or serious finding as a child issue: \
`bd create "Finding: ..." -t bug --parent <step> -l severity:<blocker|serious> -d "..."`.
2. Fix it, then close it with the fix (`bd close <finding> --reason "fixed in <commit>"`), or close a \
finding that turns out wrong with the reason it is not a defect. A finding can't close while this \
step is blocked, so close fixed findings once implement and verify are closed.
3. After fixes, run verify again and re-review the fix diff; new findings go back to 1.
Minor findings become follow-ups (`bd create ... --dep discovered-from:<step>`); nits and rejected \
findings go in a comment. bd refuses to close this step while a finding is open: unresolved \
findings wait for a person, never `--force`."""
acceptance_criteria = """
Evidence: a comment per review round with who reviewed and the counts, the shadow reviewer's \
model, effort and finding count included; every blocker/serious \
finding a closed child issue with its fix or rejection reason."""

[[steps]]
id = "spec"
title = "Feature spec: {{task}}"
type = "task"
needs = ["review"]
# Experimental: only in workspaces with `bd config set experimental.features specs`.
condition = "{{experimental.specs}}"
description = """
Keep the canonical requirements of the features this change touches current (AGENTS.md, Feature \
specs), now that review has settled the behavior. <run> below is this run (the parent of this step) and \
<issue> the issue it changes, if any. Find the specs: `bd spec list`, then `bd spec show <area> --history` \
for each one touched. Link the change to every spec it touches: \
`bd spec link <issue or run> <spec or requirement>`. For each user-visible behavior the \
change adds, changes or removes, and each thing it deliberately does not do (a non-goal), single-quote \
the text (backticks and $ in double quotes are run by the shell) and put `--` before it, with every \
option before `--` (everything after it is the text):
add: `bd spec add <spec> --from <run> -- '<behavior, one testable sentence>'` \
(a non-goal: add `--non-goal`);
change: `bd spec change <old> --from <run> -- '<new wording>'` (creates the new requirement and supersedes the old);
remove: `bd spec remove <old> -r '<why>' --from <run>`.
These check the spec and requirement and print the new id (`-q` prints only it); they do what a \
pinned `bd create` under the spec, `bd supersede` and `bd close` do by hand (docs/commands.md).
A new feature gets its spec first: \
`bd spec new <area> -d '<what it is>' -- '<feature>'`; \
a sub-feature's spec adds `--parent <its feature's spec>` (directly: another issue between two specs \
ends inheritance), and an area may hold several specs. A spec's \
requirements apply to its sub-specs (`bd spec show <sub-spec>` lists them as inherited): put a rule shared by \
the sub-features on their parent once, and never contradict a parent's requirement in a sub-spec \
(supersede the parent's instead). \
bd refuses to close or supersede a spec while any child is open, so: \
retire a feature: close its whole subtree deepest first (each sub-spec's requirements, then that sub-spec), \
then the spec's own requirements, then the spec; \
replace a feature: move its sub-specs and the requirements that still hold to the new spec \
(`bd update <id> --parent <new spec>`), supersede or close the rest, then \
`bd supersede <old spec> --with <new spec>`. Never `--force` a spec closed: an open spec under a closed one \
is an error `bd spec show` reports with its fixes. \
A change with no user-visible behavior (a refactor, tests, internal tooling) touches no spec: mark the \
issue this run sits under (the run's parent; a run with none needs no mark, runs are exempt) with \
`bd spec none <issue> -r '<why>'`. Finally `bd spec drift` lists nothing of this change as unlinked."""
acceptance_criteria = """
Evidence: the close reason lists the requirement ids added, superseded and removed per spec, or \
'no user-visible behavior change' with why."""

[[steps]]
id = "signoff"
title = "Sign-off and merge: {{task}}"
type = "task"
condition = "{{tier}} == critical"
needs = ["review", "spec"]
description = "After sign-off, merge. The records are already shared through the bd server."
acceptance_criteria = "Evidence: the approver and the merge commit in the close reason."

[steps.gate]
type = "human"
title = "Sign off: {{task}}"
assignee = "{{approver}}"
description = "Final sign-off: check the evidence on every step of this run, then `bd gate resolve` this gate."

# 5. Score --------------------------------------------------------------------

[[steps]]
id = "score"
title = "Score: {{task}}"
type = "task"
needs = ["review", "signoff", "spec"]
description = """
Required in every tier and the last work of the run: score only once every step before it \
(review, spec, signoff) and every finding is closed and the work is committed (critical: merged), so the judge sees the finished \
run. No run closes unscored, and this step never closes without the run's score_judge. \
Score how well the agent work on this run went, against .bd/rubric.md: run the `score-issue` \
workflow with issue=<this run> (the parent of this step) and actor=<your bd actor>; pass range \
(the commits from implement's close reason), result (when plan-implement-review did the work) and \
context (anything a person had to correct). The judge is gpt-6-astra (Copilot CLI) or fable \
(Claude Code): do not score it yourself. The draft is stored as the run's score_judge metadata (with the judged complexity), with the judge's comment of its \
reasoning on the run and the gap from the complexity estimate; then the workflow traces which agents did \
each step, with which model and effort, into the run's work metadata (.github/scripts/trace-run.mjs)."""
acceptance_criteria = "Evidence: the run's score_judge and work metadata and the judge's comment; the close reason gives the overall score, complexity (and the estimate) and confidence, and names any session the trace could not find."

[[steps]]
id = "score-accept"
title = "Accept score: {{task}}"
type = "task"
needs = ["score"]
condition = "{{score_confirm}} == judge"
description = """
No person confirms this run's score (score_confirm=judge): copy the run's score_judge metadata into \
its score metadata, every field but confidence, with `by` set to `judge` \
(`bd update <run> --set-metadata 'score={...,"by":"judge"}'`; .bd/rubric.md, Recording). A person \
may still adjust it later by setting score with their own name."""
acceptance_criteria = "Evidence: the run's score metadata, equal to score_judge with by=judge; the close reason gives the overall score."

[[steps]]
id = "score-confirm"
title = "Confirm score: {{task}}"
type = "decision"
needs = ["score"]
condition = "{{score_confirm}} == person"
description = """
A person reads the judge's comment and score_judge on the run, sets the run's score metadata \
(.bd/rubric.md, Recording: copy the draft, complexity included, to agree; change it and comment why, \
starting with "Score adjusted:", to adjust), then resolves the gate and closes this step."""
acceptance_criteria = "Evidence: the run's score metadata, set by a person; the close reason names who and any change from the judge's score."

[steps.gate]
type = "human"
title = "Confirm score: {{task}}"
assignee = "{{approver}}"
description = "Check the run's score_judge and the judge's comment, set the run's score metadata (.bd/rubric.md, Recording), then `bd gate resolve` this gate."

# 6. Recalibration check ------------------------------------------------------

[[steps]]
id = "recalibrate-check"
title = "Recalibration check: {{task}}"
type = "task"
needs = ["score-accept", "score-confirm"]
description = """
Run `node .github/scripts/recalibrate-due.mjs --start --actor <your bd actor>`. It counts the change \
runs with a confirmed score (the judge's or a person's) that no recalibration covers yet (this run included). At 10 it \
starts the `recalibrate` playbook over them and marks each covered run, so none counts twice; below 10 it \
starts nothing. When it starts one, the new run's report step is next work: leave it to the next session or \
claim it. Never resolve its approval gate."""
acceptance_criteria = "Evidence: the script's output in the close reason (due, count, and the recalibrate run's id when one started)."
