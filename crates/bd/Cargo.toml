[package]
name = "bd"
# binary name: bd
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "bd: command-line interface for the bd-core coordination engine"

[dependencies]
# Path only: the workspace crates are versioned together, so no version requirement to keep in sync.
bd-cli = { path = "../bd-cli" }
bd-core = { path = "../bd-core" }
bd-server = { path = "../bd-server" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"

[dev-dependencies]
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ring = "0.17"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11"
shlex = "2.0.1"
toml = "1.1.6"
ureq = { version = "3", default-features = false, features = ["rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3.27.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.5", features = ["pty"] }
