[package]
name = "bd-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "bd serve: remote workspaces over HTTPS, access tokens, sign-in and the MCP authorization server"

[dependencies]
base64 = "0.23"
# Path only: the workspace crates are versioned together, so no version requirement to keep in sync.
bd-cli = { path = "../bd-cli" }
bd-core = { path = "../bd-core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# The approval packet's Markdown (oauth_server/markdown.rs): parser only, no HTML pass-through.
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
ring = "0.17"
# <root>/server.db (server_db.rs); the version bd-core uses.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.6"
tracing = "0.1.44"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
# The admin's helper commands (helper.rs): kill(2) of their process group, and poll(2)/fcntl(2) to read their output;
# `bd serve check`'s owner gate (serve/check.rs): geteuid(2) and getpwuid_r(3).
libc = "0.2"
