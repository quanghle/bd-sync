[package]
name = "bd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "bd's commands: the command-line grammar, each command's implementation, and the client of remote workspaces"

[dependencies]
# Path only: the workspace crates are versioned together, so no version requirement to keep in sync.
bd-core = { path = "../bd-core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
fs4 = "1.1.0"
getrandom = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
shlex = "2.0.1"
similar = "3.2.0"
# `bd agents watch`: Ctrl-C and the server's long polls on one thread.
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros", "signal"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
