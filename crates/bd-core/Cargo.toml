[package]
name = "bd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Coordination engine: task lifecycle, typed dependency graph, deterministic ready work, leased claims, event history on SQLite WAL"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
regex-lite = "0.1.9"
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"

[dev-dependencies]
# Records the statements a test runs, to check their query plans.
rusqlite = { version = "0.40.2", features = ["trace"] }
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
