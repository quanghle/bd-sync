# Score how well an agent did on an issue, against .bd/rubric.md: a judge model scores, a person confirms.
# Preview with: bd playbook plan score --var issue=<id>
description = "Score agent work on an issue: a judge model drafts a score against .bd/rubric.md, the draft is accepted, or a person confirms or adjusts it (confirm=person)"
title = "Score {{issue}}"

[vars.issue]
description = "The issue, epic or playbook run to score (open or closed)"
required = true

[vars.confirm]
description = "Who confirms the judge's score: judge (its draft is the score, no gate) or person (a human gate)"
default = "judge"
enum = ["judge", "person"]

[vars.approver]
description = "Who confirms the score (confirm=person)"
default = "Quang Le"

[[steps]]
id = "judge"
title = "Judge {{issue}}"
description = """
Run the score-issue workflow (the Copilot CLI extension .github/extensions/score-issue/, judge
gpt-6-astra; or the Claude Code workflow .claude/workflows/score-issue.js, judge fable) with
issue={{issue}} and actor=<your bd actor>. Pass range when the change is known (e.g.
main..<branch>), result when a plan-implement-review run did the work, and context for anything a
person had to correct. The draft is stored as {{issue}}'s score_judge metadata, with the judge's
reasoning as a comment there. Do not score it yourself."""
acceptance_criteria = "{{issue}} has score_judge metadata and the judge's comment; the close reason gives the overall score and confidence."

[[steps]]
id = "accept"
title = "Accept the score of {{issue}}"
needs = ["judge"]
condition = "{{confirm}} == judge"
description = """
No person confirms this score (confirm=judge): copy {{issue}}'s score_judge metadata into its score
metadata, every field but confidence, with `by` set to `judge` (.bd/rubric.md, Recording). A person
may still adjust it later by setting score with their own name."""
acceptance_criteria = "{{issue}} has score metadata equal to score_judge with by=judge; the close reason gives the overall score."

[[steps]]
id = "confirm"
title = "Confirm the score of {{issue}}"
needs = ["judge"]
condition = "{{confirm}} == person"
description = """
A person reads the judge's comment and score_judge on {{issue}}, sets the score metadata
(.bd/rubric.md, Recording: copy the draft to agree, change it and comment why to adjust), then
resolves the gate and closes this step."""
acceptance_criteria = "{{issue}} has score metadata set by a person; the close reason names who and any change from the judge's score."

[steps.gate]
type = "human"
title = "Confirm the score of {{issue}}"
assignee = "{{approver}}"
description = "Check {{issue}}'s score_judge and the judge's comment, set its score metadata (.bd/rubric.md, Recording), then: bd gate resolve <this gate>"
